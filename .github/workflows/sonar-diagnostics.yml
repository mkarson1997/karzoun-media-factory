name: Sonar diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sonar-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for automatic Sonar analysis
        run: sleep 35

      - name: Print public Sonar quality metadata
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='mkarson1997_karzoun-media-factory'
          curl --fail --silent --show-error "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT&branch=main" -o gate.json
          curl --fail --silent --show-error "https://sonarcloud.io/api/measures/component?component=$PROJECT&metricKeys=security_rating,new_security_rating,vulnerabilities,new_vulnerabilities,security_hotspots,new_security_hotspots,security_review_rating,new_security_review_rating" -o measures.json
          curl --fail --silent --show-error "https://sonarcloud.io/api/hotspots/search?projectKey=$PROJECT&status=TO_REVIEW&ps=100" -o hotspots.json
          python3 - <<'PY'
          import json

          def load(path):
              with open(path, encoding='utf-8') as f:
                  return json.load(f)

          gate = load('gate.json').get('projectStatus', {})
          print('quality_gate_status=' + str(gate.get('status')))
          for condition in gate.get('conditions', []):
              metric = str(condition.get('metricKey'))
              if 'security' in metric or 'vulnerab' in metric:
                  print('gate_condition=' + json.dumps(condition, sort_keys=True))

          measures = load('measures.json').get('component', {}).get('measures', [])
          for measure in measures:
              print('measure=' + json.dumps(measure, sort_keys=True))

          hotspots = load('hotspots.json')
          items = hotspots.get('hotspots', [])
          print(f'to_review_hotspots={len(items)}')
          for item in items:
              print('hotspot=' + json.dumps({
                  'key': item.get('key'),
                  'component': item.get('component'),
                  'line': item.get('line'),
                  'message': item.get('message'),
                  'securityCategory': item.get('securityCategory'),
                  'vulnerabilityProbability': item.get('vulnerabilityProbability')
              }, sort_keys=True))
          PY
