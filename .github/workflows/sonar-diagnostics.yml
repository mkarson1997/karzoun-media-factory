name: Sonar diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sonar-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print public Sonar quality metadata
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='mkarson1997_karzoun-media-factory'

          gate_code=$(curl --silent --show-error --output gate.json --write-out '%{http_code}' "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$PROJECT&branch=main")
          measures_code=$(curl --silent --show-error --output measures.json --write-out '%{http_code}' "https://sonarcloud.io/api/measures/component?component=$PROJECT&metricKeys=security_rating,new_security_rating,vulnerabilities,new_vulnerabilities")
          echo "gate_http=$gate_code"
          echo "measures_http=$measures_code"

          python3 - <<'PY'
          import json

          def load(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception as exc:
                  return {'error': str(exc)}

          gate_data = load('gate.json')
          gate = gate_data.get('projectStatus', {}) if isinstance(gate_data, dict) else {}
          print('quality_gate_status=' + str(gate.get('status')))
          for condition in gate.get('conditions', []):
              metric = str(condition.get('metricKey'))
              if 'security' in metric or 'vulnerab' in metric:
                  print('gate_condition=' + json.dumps(condition, sort_keys=True))

          measures_data = load('measures.json')
          measures = measures_data.get('component', {}).get('measures', []) if isinstance(measures_data, dict) else []
          for measure in measures:
              print('measure=' + json.dumps(measure, sort_keys=True))
          PY
