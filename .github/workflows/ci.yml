name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Sonar security measures
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          project = 'mkarson1997_karzoun-media-factory'
          token = os.environ.get('SONAR_TOKEN', '').strip()
          print('SONAR_TOKEN_PRESENT=' + ('yes' if token else 'no'))

          headers = {'Accept': 'application/json'}
          if token:
              basic = base64.b64encode(f'{token}:'.encode()).decode()
              headers['Authorization'] = f'Basic {basic}'

          metric_keys = [
              'security_rating',
              'new_security_rating',
              'vulnerabilities',
              'new_vulnerabilities',
              'software_quality_security_rating',
              'new_software_quality_security_rating',
              'software_quality_security_issues',
              'new_software_quality_security_issues',
              'open_issues',
              'violations',
              'new_violations',
              'accepted_issues',
              'new_accepted_issues',
              'software_quality_medium_issues',
              'new_software_quality_medium_issues',
              'software_quality_high_issues',
              'new_software_quality_high_issues',
          ]

          params = {
              'component': project,
              'branch': 'main',
              'metricKeys': ','.join(metric_keys),
          }
          url = 'https://sonarcloud.io/api/measures/component?' + urllib.parse.urlencode(params)
          request = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              for measure in payload.get('component', {}).get('measures', []):
                  safe = {
                      'metric': measure.get('metric'),
                      'value': measure.get('value'),
                      'bestValue': measure.get('bestValue'),
                      'period': measure.get('period'),
                  }
                  print('SONAR_MEASURE ' + json.dumps(safe, sort_keys=True))
          except urllib.error.HTTPError as error:
              print(f'SONAR_MEASURES status={error.code}')

          for label, params in [
              ('all-open', {
                  'componentKeys': project,
                  'branch': 'main',
                  'issueStatuses': 'OPEN,CONFIRMED',
                  'ps': '100',
              }),
              ('accepted', {
                  'componentKeys': project,
                  'branch': 'main',
                  'issueStatuses': 'ACCEPTED',
                  'ps': '100',
              }),
              ('all-statuses', {
                  'componentKeys': project,
                  'branch': 'main',
                  'ps': '100',
              }),
          ]:
              issue_url = 'https://sonarcloud.io/api/issues/search?' + urllib.parse.urlencode(params)
              request = urllib.request.Request(issue_url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  print(f'SONAR_QUERY {label} status=200 total={payload.get("total", "n/a")}')
                  for issue in payload.get('issues', []):
                      impacts = issue.get('impacts') or []
                      if issue.get('type') == 'VULNERABILITY' or issue.get('severity') in {'MAJOR','CRITICAL','BLOCKER'} or any((impact or {}).get('softwareQuality') == 'SECURITY' for impact in impacts):
                          safe = {
                              'key': issue.get('key'),
                              'rule': issue.get('rule'),
                              'severity': issue.get('severity'),
                              'type': issue.get('type'),
                              'status': issue.get('status'),
                              'issueStatus': issue.get('issueStatus'),
                              'component': issue.get('component'),
                              'line': issue.get('line'),
                              'message': issue.get('message'),
                              'impacts': impacts,
                          }
                          print('SONAR_SECURITY_RELATED ' + json.dumps(safe, sort_keys=True))
              except urllib.error.HTTPError as error:
                  print(f'SONAR_QUERY {label} status={error.code}')
          PY
