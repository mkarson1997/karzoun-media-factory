name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print Sonar annotation for PR 15
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = 'https://api.github.com/repos/mkarson1997/karzoun-media-factory/check-runs/101338810076/annotations'
          request = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              annotations = json.load(response)
          for item in annotations:
              safe = {
                  'path': item.get('path'),
                  'start_line': item.get('start_line'),
                  'end_line': item.get('end_line'),
                  'annotation_level': item.get('annotation_level'),
                  'title': item.get('title'),
                  'message': item.get('message'),
              }
              print('SONAR_ANNOTATION ' + json.dumps(safe, sort_keys=True))
          print(f'SONAR_ANNOTATION_COUNT={len(annotations)}')
          PY
