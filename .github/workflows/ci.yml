name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inventory open code-scanning alerts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/code-scanning/alerts?state=open&per_page=100'
          request = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              alerts = json.load(response)

          print(f'CODE_SCANNING_ALERT_COUNT={len(alerts)}')
          for alert in alerts:
              rule = alert.get('rule') or {}
              instance = alert.get('most_recent_instance') or {}
              location = instance.get('location') or {}
              safe = {
                  'number': alert.get('number'),
                  'tool': (alert.get('tool') or {}).get('name'),
                  'rule': rule.get('id'),
                  'name': rule.get('name'),
                  'security_severity_level': rule.get('security_severity_level'),
                  'severity': rule.get('severity'),
                  'path': location.get('path'),
                  'start_line': location.get('start_line'),
                  'message': instance.get('message', {}).get('text') if isinstance(instance.get('message'), dict) else instance.get('message'),
              }
              print('CODE_SCANNING_ALERT ' + json.dumps(safe, sort_keys=True))
          PY
