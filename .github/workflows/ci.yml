name: Sonar main inventory diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Query current main Sonar inventory
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base = 'https://sonarcloud.io'
          project = 'mkarson1997_karzoun-media-factory'
          token = os.environ.get('SONAR_TOKEN', '')
          print('SONAR_TOKEN_PRESENT=' + ('true' if token else 'false'))

          def get(path, params):
              url = base + path + '?' + urllib.parse.urlencode(params)
              headers = {'User-Agent': 'karzoun-media-factory-diagnostic'}
              if token:
                  basic = base64.b64encode((token + ':').encode()).decode()
                  headers['Authorization'] = 'Basic ' + basic
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')[:1000]
                  return exc.code, {'error': body}
              except Exception as exc:
                  return None, {'error': f'{type(exc).__name__}: {exc}'}

          queries = [
              ('issues_security', '/api/issues/search', {
                  'componentKeys': project,
                  'branch': 'main',
                  'issueStatuses': 'OPEN,CONFIRMED',
                  'impactSoftwareQualities': 'SECURITY',
                  'ps': '500'
              }),
              ('issues_vulnerability', '/api/issues/search', {
                  'componentKeys': project,
                  'branch': 'main',
                  'issueStatuses': 'OPEN,CONFIRMED',
                  'types': 'VULNERABILITY',
                  'ps': '500'
              }),
              ('issues_new_code', '/api/issues/search', {
                  'componentKeys': project,
                  'branch': 'main',
                  'issueStatuses': 'OPEN,CONFIRMED',
                  'inNewCodePeriod': 'true',
                  'ps': '500'
              }),
              ('quality_gate', '/api/qualitygates/project_status', {
                  'projectKey': project,
                  'branch': 'main'
              }),
          ]

          for label, path, params in queries:
              status, payload = get(path, params)
              print(f'=== {label} status={status} ===')
              if isinstance(payload, dict) and 'issues' in payload:
                  print('total=', payload.get('total'), 'paging=', payload.get('paging'))
                  for issue in (payload.get('issues') or [])[:100]:
                      safe = {
                          'key': issue.get('key'),
                          'rule': issue.get('rule'),
                          'component': issue.get('component'),
                          'line': issue.get('line'),
                          'message': issue.get('message'),
                          'severity': issue.get('severity'),
                          'type': issue.get('type'),
                          'status': issue.get('status'),
                          'issueStatus': issue.get('issueStatus'),
                          'impacts': issue.get('impacts'),
                          'creationDate': issue.get('creationDate'),
                          'updateDate': issue.get('updateDate'),
                      }
                      print(json.dumps(safe, sort_keys=True))
              else:
                  gate = payload.get('projectStatus') if isinstance(payload, dict) else None
                  if gate:
                      print(json.dumps({
                          'status': gate.get('status'),
                          'conditions': gate.get('conditions'),
                      }, indent=2, sort_keys=True))
                  else:
                      print(json.dumps(payload, sort_keys=True)[:1500])
          PY
