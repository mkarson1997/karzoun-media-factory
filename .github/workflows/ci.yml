name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep diagnostically
        run: python -m pip install --disable-pip-version-check --quiet semgrep

      - name: Run taint-focused security scan
        shell: bash
        run: |
          set +e
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --json \
            --exclude node_modules \
            --exclude .next \
            --exclude coverage \
            --exclude data \
            --exclude media \
            . > semgrep.json
          status=$?
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('semgrep.json').read_text(encoding='utf-8'))
          results = data.get('results', [])
          interesting_terms = (
              'ssrf', 'server-side request', 'redirect', 'command', 'argument injection',
              'path traversal', 'path injection', 'xss', 'cross-site scripting',
              'sql', 'nosql', 'regex', 'redos', 'denial of service', 'eval',
              'injection', 'prototype pollution', 'deserialization'
          )
          findings = []
          for item in results:
              extra = item.get('extra') or {}
              metadata = extra.get('metadata') or {}
              text = ' '.join([
                  str(item.get('check_id', '')),
                  str(extra.get('message', '')),
                  str(metadata.get('category', '')),
                  str(metadata.get('technology', '')),
                  str(metadata.get('cwe', '')),
                  str(metadata.get('owasp', '')),
              ]).lower()
              severity = str(extra.get('severity', '')).upper()
              if severity in {'ERROR', 'WARNING'} or any(term in text for term in interesting_terms):
                  findings.append({
                      'rule': item.get('check_id'),
                      'path': item.get('path'),
                      'line': (item.get('start') or {}).get('line'),
                      'severity': severity,
                      'message': extra.get('message'),
                      'cwe': metadata.get('cwe'),
                      'owasp': metadata.get('owasp'),
                  })
          print(f'SEMGREP_TOTAL={len(results)}')
          print(f'SEMGREP_INTERESTING={len(findings)}')
          for finding in findings:
              print('SEMGREP_FINDING ' + json.dumps(finding, sort_keys=True))
          PY

          echo "semgrep_exit_status=$status"
