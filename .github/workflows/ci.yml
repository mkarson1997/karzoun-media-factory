name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read source-copy Sonar annotations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/check-runs/101823743364/annotations" \
            --jq '.[] | {path, start_line, end_line, annotation_level, title, message}'
