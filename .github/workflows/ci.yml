name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve production image inputs
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:24-alpine >/dev/null
          {
            echo "NODE_IMAGE=$(docker image inspect node:24-alpine --format '{{index .RepoDigests 0}}')"
            docker run --rm node:24-alpine sh -lc 'echo ALPINE_VERSION=$(cat /etc/alpine-release); apk policy ffmpeg font-dejavu'
          } | tee docker-inputs.txt

      - name: Upload production image metadata
        uses: actions/upload-artifact@v4
        with:
          name: docker-inputs
          path: docker-inputs.txt
          if-no-files-found: error
          retention-days: 1
