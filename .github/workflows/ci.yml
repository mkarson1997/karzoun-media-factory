name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inventory Sonar security issues
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          project = 'mkarson1997_karzoun-media-factory'
          token = os.environ.get('SONAR_TOKEN', '').strip()
          print('SONAR_TOKEN_PRESENT=' + ('yes' if token else 'no'))

          headers = {'Accept': 'application/json'}
          if token:
              basic = base64.b64encode(f'{token}:'.encode()).decode()
              headers['Authorization'] = f'Basic {basic}'

          def get(label, path, params):
              url = 'https://sonarcloud.io' + path + '?' + urllib.parse.urlencode(params)
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                  print(f'SONAR_QUERY {label} status=200 total={payload.get("total", "n/a")}')
                  for issue in payload.get('issues', []):
                      safe = {
                          'key': issue.get('key'),
                          'rule': issue.get('rule'),
                          'severity': issue.get('severity'),
                          'type': issue.get('type'),
                          'status': issue.get('status'),
                          'issueStatus': issue.get('issueStatus'),
                          'component': issue.get('component'),
                          'line': issue.get('line'),
                          'message': issue.get('message'),
                          'impacts': issue.get('impacts'),
                          'cleanCodeAttribute': issue.get('cleanCodeAttribute'),
                      }
                      print('SONAR_ISSUE ' + json.dumps(safe, sort_keys=True))
              except urllib.error.HTTPError as error:
                  print(f'SONAR_QUERY {label} status={error.code}')

          get('security-quality', '/api/issues/search', {
              'componentKeys': project,
              'branch': 'main',
              'issueStatuses': 'OPEN,CONFIRMED',
              'impactSoftwareQualities': 'SECURITY',
              'ps': '100',
          })
          get('vulnerabilities', '/api/issues/search', {
              'componentKeys': project,
              'branch': 'main',
              'issueStatuses': 'OPEN,CONFIRMED',
              'types': 'VULNERABILITY',
              'ps': '100',
          })
          get('major-plus', '/api/issues/search', {
              'componentKeys': project,
              'branch': 'main',
              'issueStatuses': 'OPEN,CONFIRMED',
              'severities': 'MAJOR,CRITICAL,BLOCKER',
              'ps': '100',
          })
          PY
