name: Sonar diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  inspect-sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read script-layer Sonar annotations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/${{ github.repository }}/check-runs/102068768727/annotations?per_page=100' \
            --jq '.[] | {path, start_line, end_line, annotation_level, title, message}'
