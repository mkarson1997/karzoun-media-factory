name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sonar current issue inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          def query(label, extra):
              params = {
                  'componentKeys': 'mkarson1997_karzoun-media-factory',
                  'branch': 'main',
                  'ps': '100',
              }
              params.update(extra)
              url = 'https://sonarcloud.io/api/issues/search?' + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
              issues = payload.get('issues', [])
              print(f'SONAR_QUERY {label} total={payload.get("total")} returned={len(issues)}')
              for issue in issues:
                  item = {
                      'key': issue.get('key'),
                      'rule': issue.get('rule'),
                      'severity': issue.get('severity'),
                      'type': issue.get('type'),
                      'status': issue.get('status'),
                      'issueStatus': issue.get('issueStatus'),
                      'component': issue.get('component'),
                      'line': issue.get('line'),
                      'message': issue.get('message'),
                      'impacts': issue.get('impacts'),
                      'cleanCodeAttribute': issue.get('cleanCodeAttribute'),
                  }
                  print('SONAR_ISSUE ' + json.dumps(item, sort_keys=True))

          query('all-main', {})
          query('unresolved-main', {'resolved': 'false'})
          query('vulnerability-main', {'types': 'VULNERABILITY', 'resolved': 'false'})
          PY
