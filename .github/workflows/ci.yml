name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print historical Sonar annotations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          check_runs = {
              'pr13': 101333486954,
          }
          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          for label, check_run_id in check_runs.items():
              url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/check-runs/{check_run_id}/annotations'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  annotations = json.load(response)
              print(f'SONAR_ANNOTATION_SET {label} count={len(annotations)}')
              for item in annotations:
                  safe = {
                      'path': item.get('path'),
                      'start_line': item.get('start_line'),
                      'end_line': item.get('end_line'),
                      'annotation_level': item.get('annotation_level'),
                      'title': item.get('title'),
                      'message': item.get('message'),
                  }
                  print('SONAR_ANNOTATION ' + json.dumps(safe, sort_keys=True))
          PY
