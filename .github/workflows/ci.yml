name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Install SonarJS ESLint plugin without modifying the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts eslint-plugin-sonarjs@latest

      - name: Run SonarJS vulnerability rules
        shell: bash
        run: |
          cat > eslint.security-diagnostic.mjs <<'EOF'
          import base from './eslint.config.mjs';
          import sonarjs from 'eslint-plugin-sonarjs';

          const vulnerabilityDescriptions = new Set([
            'Administration services access should be restricted to specific IP addresses',
            'AWS IAM policies should limit the scope of permissions given',
            'Applications should not create session cookies from untrusted input',
            'DOM updates should not lead to open redirect vulnerabilities',
            'Extracting archives should not lead to zip slip vulnerabilities',
            'OS commands should not be vulnerable to argument injection attacks',
            'A new session should be created during user authentication',
            'DOM updates should not lead to cross-site scripting (XSS) attacks',
            'JWT should be signed and verified with strong cipher algorithms',
            'Cipher algorithms should be robust',
            'Encryption algorithms should be used with secure mode and padding scheme',
            'Server hostnames should be verified during SSL/TLS connections',
            'Dynamic code execution should not be vulnerable to injection attacks',
            'NoSQL operations should not be vulnerable to injection attacks',
            'HTTP request redirections should not be open to forging attacks',
            'Server-side requests should not be vulnerable to forging attacks',
            'Endpoints should not be vulnerable to reflected cross-site scripting (XSS) attacks',
            'Server certificates should be verified during SSL/TLS connections',
            'Cryptographic keys should be robust',
            'Weak SSL/TLS protocols should not be used',
            'Database queries should not be vulnerable to injection attacks',
            'Local storage should not be used',
            'Origins should be verified during cross-origin communications',
            'Web SQL databases should not be used',
            'XML parsers should not be vulnerable to XXE attacks',
            'Regular expressions should not be vulnerable to Denial of Service attacks',
            'File uploads should be restricted',
            'I/O function calls should not be vulnerable to path injection attacks',
            'OS commands should not be vulnerable to command injection attacks',
            'Debugger statements should not be used'
          ]);

          const selected = Object.entries(sonarjs.rules).filter(([, rule]) => {
            const description = rule?.meta?.docs?.description;
            return vulnerabilityDescriptions.has(description);
          });

          console.error(`SONARJS_VULNERABILITY_RULES=${selected.length}`);
          for (const [name, rule] of selected) {
            console.error(`SONARJS_RULE ${name} :: ${rule.meta.docs.description}`);
          }

          const rules = Object.fromEntries(selected.map(([name]) => [`sonarjs/${name}`, 'error']));

          export default [
            ...base,
            {
              plugins: { sonarjs },
              rules
            }
          ];
          EOF

          set +e
          npx eslint . --config eslint.security-diagnostic.mjs --format json > sonarjs-vulnerabilities.json
          status=$?
          set -e

          node - <<'NODE'
          const fs = require('node:fs');
          const results = JSON.parse(fs.readFileSync('sonarjs-vulnerabilities.json', 'utf8'));
          let count = 0;
          for (const result of results) {
            for (const item of result.messages || []) {
              if (!String(item.ruleId || '').startsWith('sonarjs/')) continue;
              count += 1;
              console.log('SONARJS_FINDING ' + JSON.stringify({
                file: result.filePath.replace(process.cwd() + '/', ''),
                rule: item.ruleId,
                line: item.line,
                column: item.column,
                message: item.message,
                severity: item.severity
              }));
            }
          }
          console.log(`SONARJS_FINDING_COUNT=${count}`);
          NODE

          echo "eslint_exit_status=$status"
