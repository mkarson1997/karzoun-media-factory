name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture prior Sonar annotation safely
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/check-runs/101809892533/annotations" \
            --jq '[.[] | {path, start_line, end_line, annotation_level, title, message}]' \
            > sonar-annotations.json
          cat sonar-annotations.json

      - name: Upload annotation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonar-annotation
          path: sonar-annotations.json
          if-no-files-found: error
          retention-days: 1
