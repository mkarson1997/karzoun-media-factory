name: Sonar diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query SonarQube Cloud security impacts
        shell: bash
        run: |
          set -euo pipefail

          query_issues() {
            local scope="$1"
            shift
            echo "=== ${scope} security-impact issues ==="
            curl -fsSLG 'https://sonarcloud.io/api/issues/search' \
              --data-urlencode 'componentKeys=mkarson1997_karzoun-media-factory' \
              --data-urlencode 'ps=500' \
              "$@" \
              | jq '{total, securityIssues: [.issues[] | select(any(.impacts[]?; .softwareQuality == "SECURITY")) | {key, rule, severity, type, component, line, message, status, creationDate, cleanCodeAttribute, impacts}]}'
          }

          query_issues 'PR 22' --data-urlencode 'pullRequest=22'
          query_issues 'main' --data-urlencode 'branch=main' --data-urlencode 'statuses=OPEN,CONFIRMED'
