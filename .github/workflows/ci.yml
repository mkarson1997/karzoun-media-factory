name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Prepare ephemeral build configuration
        shell: bash
        run: |
          APP_SECRET_VALUE="$(openssl rand -hex 32)"
          DB_PASSWORD="$(openssl rand -hex 24)"
          echo "APP_SECRET=$APP_SECRET_VALUE" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://kmf:$DB_PASSWORD@127.0.0.1:5432/kmf?schema=public" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          ZERO_COST_MODE: 'true'
          VIDEO_PROVIDER: local-demo
          PUBLISHING_PROVIDER: mock
          ALLOW_PAID_GENERATION: 'false'
          ALLOW_AUTOPILOT_PAID_GENERATION: 'false'
          ALLOW_YOUTUBE_UPLOAD: 'false'
          ALLOW_PUBLIC_PUBLISHING: 'false'

      - name: Sonar current security inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({
              'componentKeys': 'mkarson1997_karzoun-media-factory',
              'issueStatuses': 'OPEN,CONFIRMED',
              'ps': '100',
          })
          url = f'https://sonarcloud.io/api/issues/search?{params}'
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.load(response)

          security = []
          for issue in payload.get('issues', []):
              impacts = issue.get('impacts') or []
              is_security = issue.get('type') == 'VULNERABILITY' or any(
                  impact.get('softwareQuality') == 'SECURITY' for impact in impacts
              )
              if not is_security:
                  continue
              item = {
                  'key': issue.get('key'),
                  'rule': issue.get('rule'),
                  'severity': issue.get('severity'),
                  'type': issue.get('type'),
                  'component': issue.get('component'),
                  'line': issue.get('line'),
                  'message': issue.get('message'),
                  'impacts': impacts,
              }
              security.append(item)
              print('SONAR_SECURITY_ISSUE ' + json.dumps(item, sort_keys=True))
          print(f'SONAR_SECURITY_ISSUE_COUNT={len(security)}')
          PY
