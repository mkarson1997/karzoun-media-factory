name: Sonar diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query SonarQube Cloud issues
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PR 22 vulnerabilities ==='
          curl -fsSLG 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=mkarson1997_karzoun-media-factory' \
            --data-urlencode 'pullRequest=22' \
            --data-urlencode 'types=VULNERABILITY' \
            --data-urlencode 'ps=100' \
            | jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message, status, cleanCodeAttribute, impacts}]}'

          echo '=== main vulnerabilities ==='
          curl -fsSLG 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=mkarson1997_karzoun-media-factory' \
            --data-urlencode 'branch=main' \
            --data-urlencode 'types=VULNERABILITY' \
            --data-urlencode 'statuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
            | jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message, status, creationDate, cleanCodeAttribute, impacts}]}'

          echo '=== PR 22 hotspots ==='
          curl -fsSLG 'https://sonarcloud.io/api/hotspots/search' \
            --data-urlencode 'projectKey=mkarson1997_karzoun-media-factory' \
            --data-urlencode 'pullRequest=22' \
            --data-urlencode 'ps=100' \
            | jq '{paging, hotspots: [.hotspots[] | {key, component, line, message, status, vulnerabilityProbability, securityCategory}]}'
