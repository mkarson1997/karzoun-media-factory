services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "npx prisma db push && npm run seed && npm start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/readiness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    command: ["npm", "run", "worker"]
    restart: unless-stopped
