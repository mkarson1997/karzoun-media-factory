services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kmf
      POSTGRES_USER: kmf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kmf-local-only}
    volumes:
      - kmf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmf -d kmf"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kmf:${POSTGRES_PASSWORD:-kmf-local-only}@db:5432/kmf?schema=public
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
      PUBLISHING_PROVIDER: ${PUBLISHING_PROVIDER:-mock}
      CREATIVE_DIRECTOR: ${CREATIVE_DIRECTOR:-mock}
      ALLOW_PAID_GENERATION: ${ALLOW_PAID_GENERATION:-false}
      ALLOW_YOUTUBE_UPLOAD: ${ALLOW_YOUTUBE_UPLOAD:-false}
      ALLOW_PUBLIC_PUBLISHING: ${ALLOW_PUBLIC_PUBLISHING:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma db push && npm run seed && npm start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kmf:${POSTGRES_PASSWORD:-kmf-local-only}@db:5432/kmf?schema=public
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mock}
      PUBLISHING_PROVIDER: ${PUBLISHING_PROVIDER:-mock}
      CREATIVE_DIRECTOR: ${CREATIVE_DIRECTOR:-mock}
      ALLOW_PAID_GENERATION: ${ALLOW_PAID_GENERATION:-false}
      ALLOW_YOUTUBE_UPLOAD: ${ALLOW_YOUTUBE_UPLOAD:-false}
      ALLOW_PUBLIC_PUBLISHING: ${ALLOW_PUBLIC_PUBLISHING:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ANALYTICS_SYNC_MINUTES: ${ANALYTICS_SYNC_MINUTES:-30}
    depends_on:
      app:
        condition: service_healthy
    command: ["npm", "run", "worker"]
    restart: unless-stopped

volumes:
  kmf-postgres:
